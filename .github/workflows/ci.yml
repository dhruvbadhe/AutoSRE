name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # No GEMINI_API_KEY here on purpose: tests/conftest.py fakes the LLM and blocks network.
      - name: Test
        run: pytest -q --cov=app --cov-report=term-missing

      - name: Docker build
        run: docker build -t autosre:ci .

      - name: CLI smoke test
        run: |
          python -m venv /tmp/cli
          /tmp/cli/bin/pip install .
          /tmp/cli/bin/autosre --help
