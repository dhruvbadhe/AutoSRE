[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autosre"
version = "1.0.0"
authors = [
  { name="Dhruv Badhe", email="dhruvbadhe@users.noreply.github.com" },
]
description = "⚡ AutoSRE: Autonomous Incident Response Agent powered by Corrective RAG (CRAG) & Multi-Index Hybrid Search"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0"
]

[project.scripts]
autosre = "app.cli:app"

[project.urls]
"Homepage" = "https://github.com/dhruvbadhe/AutoSRE"
"Bug Tracker" = "https://github.com/dhruvbadhe/AutoSRE/issues"
